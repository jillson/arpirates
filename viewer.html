<!DOCTYPE html>
<html lang="en">
	<head>
		<title>Pirate  Ocean Viewer</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<meta property="og:title" content="three.js webgl - shaders - ocean">
		<meta property="og:type" content="website">
		<meta property="og:url" content="https://threejs.org/examples/webgl_shaders_ocean.html">
		<meta property="og:image" content="https://threejs.org/examples/screenshots/webgl_shaders_ocean.jpg">
		<link type="text/css" rel="stylesheet" href="main.css">
	</head>
	<body>

		<div id="container"></div>

         <button id="start-btn">Enable Phone Rotation</button>

        <div id="image-overlay" style="display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); justify-content: center; align-items: center; z-index: 10;">
            <div style="position: relative;">
                <button id="close-btn" style="position: absolute; top: -30px; right: 0; color: white; background: none; border: none; font-size: 20px; cursor: pointer;">✕ Close</button>
                <img id="overlay-img" src="" alt="Popup" style="max-width: 90vw; max-height: 80vh; border-radius: 8px;" />
            </div>
        </div>

        <script type="importmap">
        {
            "imports": {
                "three": "./node_modules/three/build/three.module.js",
                "three/addons/": "./node_modules/three/examples/jsm/"
            }
        }
    </script>

		
		<script type="module">

			import * as THREE from 'three';

			import { GUI } from 'three/addons/libs/lil-gui.module.min.js';
			import { Water } from 'three/addons/objects/Water.js';
			import { Sky } from 'three/addons/objects/Sky.js';
            import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
   
            const overlay = document.getElementById('image-overlay');
            const overlayImg = document.getElementById('overlay-img');
            const closeBtn = document.getElementById('close-btn');

            closeBtn.addEventListener('click', () => { overlay.style.display = 'none'; });

			let container, stats, timer;
			let camera, scene, renderer;
            //let controls;
			let water, sun, sky;

            const raycaster = new THREE.Raycaster();
            const mouse = new THREE.Vector2();
            let clickableObjects = [];

            const serverRotation = new THREE.Euler(0, 0, 0, 'YXZ');
            const phoneRotation = new THREE.Euler(0, 0, 0, 'YXZ');

            const serverQuaternion = new THREE.Quaternion();
            const phoneQuaternion = new THREE.Quaternion();
            const loader = new GLTFLoader();

			init();

            function init() {

				container = document.getElementById( 'container' );

				renderer = new THREE.WebGLRenderer( { outputBufferType: THREE.HalfFloatType } );
				renderer.setPixelRatio( window.devicePixelRatio );
				renderer.setSize( window.innerWidth, window.innerHeight );
				renderer.setAnimationLoop( animate );
				renderer.toneMapping = THREE.ACESFilmicToneMapping;
				renderer.toneMappingExposure = 0.1;
				container.appendChild( renderer.domElement );

				scene = new THREE.Scene();

				camera = new THREE.PerspectiveCamera( 55, window.innerWidth / window.innerHeight, 1, 20000 );
				camera.position.set( 30, 30, 100 );

				timer = new THREE.Timer();

				sun = new THREE.Vector3();

				const waterGeometry = new THREE.PlaneGeometry( 10000, 10000 );

				water = new Water(
					waterGeometry,
					{
						textureWidth: 512,
						textureHeight: 512,
						waterNormals: new THREE.TextureLoader().load( 'textures/waternormals.jpg', function ( texture ) {

							texture.wrapS = texture.wrapT = THREE.RepeatWrapping;

						} ),
						sunDirection: new THREE.Vector3(),
						sunColor: 0xffffff,
						waterColor: 0x001e0f,
						distortionScale: 3.7,
						fog: scene.fog !== undefined
					}
				);

				water.rotation.x = - Math.PI / 2;

				scene.add( water );

				// Skybox

				sky = new Sky();
				sky.scale.setScalar( 10000 );
				scene.add( sky );

				const skyUniforms = sky.material.uniforms;

				skyUniforms[ 'turbidity' ].value = 10;
				skyUniforms[ 'rayleigh' ].value = 2;
				skyUniforms[ 'mieCoefficient' ].value = 0.005;
				skyUniforms[ 'mieDirectionalG' ].value = 0.8;
				skyUniforms[ 'cloudCoverage' ].value = 0.52;
				skyUniforms[ 'cloudDensity' ].value = 0.85;
				skyUniforms[ 'cloudElevation' ].value = 0.5;

				const parameters = {
					elevation: 40,
					azimuth: -24,
					exposure: 0.2
				};

				const pmremGenerator = new THREE.PMREMGenerator( renderer );
				const sceneEnv = new THREE.Scene();

				let renderTarget;

				function updateSun() {

					const phi = THREE.MathUtils.degToRad( 90 - parameters.elevation );
					const theta = THREE.MathUtils.degToRad( parameters.azimuth );

					sun.setFromSphericalCoords( 1, phi, theta );

					sky.material.uniforms[ 'sunPosition' ].value.copy( sun );
					water.material.uniforms[ 'sunDirection' ].value.copy( sun ).normalize();

					if ( renderTarget !== undefined ) renderTarget.dispose();

					sceneEnv.add( sky );
					renderTarget = pmremGenerator.fromScene( sceneEnv );
					scene.add( sky );

					scene.environment = renderTarget.texture;

				}

				updateSun();

				//


                (load_ships()    ).then( () => { console.log("ship loaded") });

                /*
                controls = new OrbitControls(camera, renderer.domElement);
                controls.maxPolarAngle = Math.PI * 0.495; // Stop camera from sinking below water line
                controls.minPolarAngle = Math.PI * 0.495; // Stop camera from sinking below water line
                controls.target.set(0, 10, 0);
                controls.minDistance = 40.0;
                controls.maxDistance = 200.0;
                */
                                
				window.addEventListener( 'resize', onWindowResize );

                window.addEventListener('pointermove', (event) => {
                    
                    mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
                    mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
                });

                window.addEventListener('pointerdown', (event) => {
                    // Update coordinates immediately at the point of impact
                    mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
                    mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

                    
                    raycaster.setFromCamera(mouse, camera);
                    const intersects = raycaster.intersectObjects(clickableObjects, true); //.children, true);

                    if (intersects.length > 0) {
                        const targetObject = intersects[0].object; // Added array index fix
                        let userData = find_user_data(targetObject);
                        if (userData) {
                            overlayImg.src = userData.imageUrl;
                            overlay.style.display = 'flex';
                            console.log('Object tapped!', userData.imageUrl);
                        }

                    }
                });

               
                document.getElementById('start-btn').addEventListener('click', async () => {
                    if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                        try {
                            const permissionState = await DeviceOrientationEvent.requestPermission();
                            if (permissionState === 'granted') {
                                window.addEventListener('deviceorientation', onDeviceOrientation, true);
                                document.getElementById('start-btn').style.display = 'none'; // hide button
                            }
                        } catch (error) {
                            console.error('Sensor access denied', error);
                        }
                    } else {
                        // Desktop or Android fallback (no explicit permission needed)
                        window.addEventListener('deviceorientation', onDeviceOrientation, true);
                    }
                });
                /* 
                // 1. Listen for Server Updates (e.g., via WebSockets)
                socket.on('ship-rotation-update', (data) => {
                    // Assuming server sends pitch, yaw, roll in radians
                    serverRotation.set(data.pitch, data.yaw, data.roll, 'YXZ');
                    serverQuaternion.setFromEuler(serverRotation);
                });
                */

                // 2. Listen for iPhone Gyroscope (Alpha = Z, Beta = X, Gamma = Y)
                function onDeviceOrientation(event) {
                    if (!event.alpha) return;

                    // Convert degrees to radians
                    const alpha = THREE.MathUtils.degToRad(event.alpha); // Z-axis rotation
                    const beta = THREE.MathUtils.degToRad(event.beta);   // X-axis rotation
                    const gamma = THREE.MathUtils.degToRad(event.gamma); // Y-axis rotation

                    // Adjust orientation based on standard phone posture (landscape vs portrait)
                    phoneRotation.set(beta, alpha, -gamma, 'YXZ'); 
                    phoneQuaternion.setFromEuler(phoneRotation);
                }
			}

			function onWindowResize() {

				camera.aspect = window.innerWidth / window.innerHeight;
				camera.updateProjectionMatrix();

				renderer.setSize( window.innerWidth, window.innerHeight );

			}

			function animate() {

				timer.update();
                camera.quaternion.copy(serverQuaternion).multiply(phoneQuaternion);
				const time = performance.now() * 0.001;
				const delta = timer.getDelta();
				water.material.uniforms[ 'time' ].value += delta;
				sky.material.uniforms[ 'time' ].value = time;
				renderer.render( scene, camera );

            }

            async function load_ships() {
                                
                let gltf = await loader.loadAsync('assets/ship_v1.glb'); 
                const originalModel = gltf.scene;

                // Define positions for your 4-5 items (some far away / off-screen)
                const positions = [
                    new THREE.Vector3(0, 0, -10),    // Right in front
                    new THREE.Vector3(25, 0, -5),    // To the right side
                    new THREE.Vector3(-30, 0, -100), // Far away off-screen left
                    new THREE.Vector3(30, 0, 4000),   // Behind and below the camera
                    new THREE.Vector3(50, 0, 10)     // Far right off-screen
                ];

                positions.forEach((pos, index) => {
                    // Clone the original object hierarchy
                    const modelCopy = originalModel.clone();
                    
                    // Position it uniquely
                    modelCopy.position.copy(pos);
                    
                    // Assign distinct user data for your 2D image popup logic
                    modelCopy.userData = { 
                        imageUrl: `/assets/flag${index + 1}.svg`,
                        name: `Object #${index + 1}`
                    };
                    // Add to your raycasting target array and the scene
                    scene.add(modelCopy);
                    clickableObjects.push(modelCopy); 
                });
            }

            function find_user_data(targetObject) {
                if (targetObject.userData.imageUrl) {
                    return targetObject.userData;
                }
                if (targetObject.parent) {
                    return find_user_data(targetObject.parent);
                }
                print("bailed out with" + targetObject.userData);
                return null;
            }
       
		</script>
	</body>
</html>
