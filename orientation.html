<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Device Orientation</title>
<link rel="stylesheet" type="text/css" href="style.css">
</head>

<body>
<h1>Device Orientation</h1>


    <!-- Import Map to fetch Three.js from CDN -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com",
                "three/addons/": "https://unpkg.com"
            }
        }
    </script>
</head>
<body>
    <div id="info">Initializing scene...</div>

    <script type="module">
        import * as THREE from 'three';
        // Note: We use WebGPURenderer from the main build file in modern Three.js
        import WebGPURenderer from 'https://unpkg.com'; 
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        let camera, scene, renderer, controls, mesh;
        const infoElement = document.getElementById('info');

        init();

        async function init() {
            // 1. Setup Scene and Camera
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 100);
            camera.position.z = 4;

            // 2. Initialize WebGPURenderer (Handles fallback automatically)
            renderer = new WebGPURenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setAnimationLoop(animate);
            document.body.appendChild(renderer.domElement);

            // Update UI to show which backend was selected
            // We wait one frame or check backend type after renderer initialization
            setTimeout(() => {
                const isWebGPU = renderer.backend && renderer.backend.isWebGPUBackend;
                infoElement.innerText = isWebGPU 
                    ? "🚀 Running on WebGPU" 
                    : "🔄 WebGPU unsupported. Falling back to WebGL 2";
            }, 100);

            // 3. Add a simple spinning cube and lighting
            const geometry = new THREE.BoxGeometry();
            const material = new THREE.MeshNormalMaterial();
            mesh = new THREE.Mesh(geometry, material);
            scene.add(mesh);

            // 4. Controls & Window Resize
            controls = new OrbitControls(camera, renderer.domElement);
            window.addEventListener('resize', onWindowResize);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            // Simple animation loop
            mesh.rotation.x += 0.01;
            mesh.rotation.y += 0.02;
            controls.update();
            renderer.render(scene, camera);
        }
    </script>




<button id="start">Enable sensors</button>
<div id="status">Not started.</div>

<div id="box"></div>

<table>
  <tr><td>alpha (z, 0–360°)</td><td id="alpha">–</td></tr>
  <tr><td>beta (x, -180–180°)</td><td id="beta">–</td></tr>
  <tr><td>gamma (y, -90–90°)</td><td id="gamma">–</td></tr>
  <tr><td>compass heading (iOS)</td><td id="heading">–</td></tr>
  <tr><td>absolute</td><td id="absolute">–</td></tr>
</table>

<div>
  <button id="fetch" disabled>GET from server</button>
</div>
<div id="status2" style="color:#888;font-size:14px">
  Server: <span id="server">(none — add ?server=api.example.com)</span>
</div>
<pre id="log"></pre>

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js"}}</script>
<script type="module" src="app.js"></script>

<script>
(function () {
  const $ = id => document.getElementById(id);
  const log = msg => { $('log').textContent = msg; };

  // Server hostname from ?server=host[:port]. Accepts a full URL too.
  const params = new URLSearchParams(location.search);
  let server = params.get('server');
  if (server) {
    $('server').textContent = server;
  }

  let last = null;

  function onOrientation(e) {
    last = {
      alpha: e.alpha, beta: e.beta, gamma: e.gamma,
      heading: e.webkitCompassHeading ?? null,
      absolute: e.absolute ?? null,
      t: Date.now()
    };
    const f = v => (v == null ? '–' : v.toFixed(1) + '°');
    $('alpha').textContent = f(e.alpha);
    $('beta').textContent = f(e.beta);
    $('gamma').textContent = f(e.gamma);
    $('heading').textContent = f(e.webkitCompassHeading);
    $('absolute').textContent = String(e.absolute);
    $('box').style.transform =
      `rotateX(${e.beta || 0}deg) rotateY(${e.gamma || 0}deg) rotateZ(${-(e.alpha || 0)}deg)`;
  }

  async function start() {
    if (!window.isSecureContext) {
      $('status').textContent = 'HTTPS is required for motion/orientation sensors.';
      return;
    }
    if (typeof DeviceOrientationEvent === 'undefined') {
      $('status').textContent = 'DeviceOrientationEvent not supported here.';
      return;
    }
    try {
      // iOS 13+ requires a permission request from a user gesture.
      if (typeof DeviceOrientationEvent.requestPermission === 'function') {
        const state = await DeviceOrientationEvent.requestPermission();
        if (state !== 'granted') {
          $('status').textContent = 'Permission ' + state + '. Reset via Settings > Safari > Advanced > Website Data, or fully close Safari and retry.';
          return;
        }
      }
      window.addEventListener('deviceorientation', onOrientation);
      $('status').textContent = 'Listening… (move your phone)';
      $('start').disabled = true;
      if (server) { $('send').disabled = false; $('fetch').disabled = false; }
    } catch (err) {
      $('status').textContent = 'Error: ' + err.message;
    }
  }


  async function get() {
    try {
      const r = await fetch(server + '/orientation');
      log('GET ' + r.status + '\n' + (await r.text()).slice(0, 500));
    } catch (err) {
      log('GET failed: ' + err.message + '\n(Check HTTPS and CORS on the server.)');
    }
  }

  $('start').addEventListener('click', start);
  $('fetch').addEventListener('click', get);
})();
</script>
</body>
</html>
